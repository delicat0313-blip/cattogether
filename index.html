<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 냥이랑 네컷사진 찍기</title>
    <style>
        :root { --main-color: #ffb7b7; --bg-color: #fff5f5; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); text-align: center; margin: 0; padding: 20px; }
        
        #app { max-width: 800px; margin: 0 auto; }
        
        /* 실시간 캠 화면 */
        .video-container { position: relative; width: 480px; height: 360px; margin: 0 auto; border: 8px solid white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: rotateY(180deg); }
        
        /* 카운트다운 표시 */
        #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; color: white; font-weight: bold; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); display: none; }

        /* 컨트롤 버튼 */
        .controls { margin: 20px 0; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 50px; border: none; background: var(--main-color); color: white; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 10px rgba(255,183,183,0.5); }
        button:hover { background: #ff9999; transform: translateY(-2px); }
        button:disabled { background: #ccc; box-shadow: none; }

        /* 결과물 캔버스 */
        #photo-result { display: inline-block; padding: 20px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: 20px; display: none; }
        canvas { max-width: 300px; height: auto; border: 1px solid #eee; }

        /* 인쇄 설정 */
        @media print {
            body * { display: none; }
            #photo-result, #photo-result canvas { display: block !important; position: absolute; top: 0; left: 0; }
            #photo-result { box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

    <div id="app">
        <h1>🐱 냥이 네컷 스튜디오 🐱</h1>
        
        <div class="video-container">
            <video id="webcam" autoplay playsinline></video>
            <div id="countdown">3</div>
        </div>

        <div class="controls">
            <button id="start-btn">📸 사진 찍기 시작!</button>
            <button id="print-btn" style="display:none; background-color: #6c5ce7;">🖨️ 인쇄하기 / 저장</button>
        </div>

        <div id="photo-result">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const printBtn = document.getElementById('print-btn');
        const countdownEl = document.getElementById('countdown');
        const resultDiv = document.getElementById('photo-result');

        // 샘플 고양이 이미지 (인터넷 이미지)
        const catImg = new Image();
        catImg.crossOrigin = "anonymous"; 
        catImg.src = "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=400&auto=format&fit=crop";

        // 카메라 설정
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => alert("카메라 권한을 허용해주세요!"));

        async function takePhotos() {
            startBtn.disabled = true;
            resultDiv.style.display = 'none';
            
            // 캔버스 사이즈 설정 (네컷사진 비율)
            canvas.width = 400;
            canvas.height = 1200;
            
            // 배경색 칠하기 (연한 핑크 프레임)
            ctx.fillStyle = "#ffefef";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < 4; i++) {
                // 카운트다운 3, 2, 1
                countdownEl.style.display = 'block';
                for (let count = 3; count > 0; count--) {
                    countdownEl.innerText = count;
                    await new Promise(r => setTimeout(r, 1000));
                }
                countdownEl.style.display = 'none';

                // 사진 찰칵!
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 360;
                tempCanvas.height = 240;
                const tempCtx = tempCanvas.getContext('2d');
                
                // 좌우 반전해서 그리기
                tempCtx.translate(360, 0);
                tempCtx.scale(-1, 1);
                tempCtx.drawImage(video, 0, 0, 360, 240);

                // 메인 캔버스에 붙이기 (좌우 여백 20px, 상단 여백부터 차례로)
                const yPos = 30 + (i * 260);
                ctx.drawImage(tempCanvas, 20, yPos);
            }

            // 하단에 고양이 샘플 이미지 그리기 (장식용)
            // 사진 촬영 영역 아래에 고양이 얼굴이 나오도록 합성
            ctx.save();
            ctx.beginPath();
            ctx.arc(200, 1100, 70, 0, Math.PI * 2); // 하단 원형 프레임
            ctx.clip();
            ctx.drawImage(catImg, 130, 1030, 140, 140);
            ctx.restore();

            // 프레임 꾸미기 (텍스트)
            ctx.fillStyle = "#ff9999";
            ctx.font = "bold 20px Arial";
            ctx.textAlign = "center";
            ctx.fillText("WITH MY CAT", 200, 1185);

            resultDiv.style.display = 'block';
            printBtn.style.display = 'inline-block';
            startBtn.disabled = false;
            alert("와우! 네컷사진이 완성되었습니다.");
        }

        startBtn.addEventListener('click', takePhotos);
        printBtn.addEventListener('click', () => window.print());

    </script>
</body>
</html>
